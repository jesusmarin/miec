# PostgreSQL 14 local. Activar con --spring.profiles.active=postgres.
# Historial PostgreSQL independiente; no ejecutar las migraciones H2.
# Definir MIEC_POSTGRES_PASSWORD; no guardar secretos reales en Git.
spring.datasource.url=${MIEC_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5532/miec-v01?currentSchema=public}
spring.datasource.username=${MIEC_POSTGRES_USERNAME:postgres}
spring.datasource.password=${MIEC_POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql
spring.flyway.fail-on-missing-locations=true
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
