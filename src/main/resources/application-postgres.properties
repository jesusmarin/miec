# PostgreSQL 14 local. Activar con --spring.profiles.active=postgres.
# Configuración de conexión; la portabilidad de esquema/consultas sigue pendiente.
spring.datasource.url=${MIEC_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5532/miec-v01?currentSchema=public}
spring.datasource.username=${MIEC_POSTGRES_USERNAME:postgres}
# Sustituir xxx o definir MIEC_POSTGRES_PASSWORD sin guardar la contraseña en Git.
spring.datasource.password=${MIEC_POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
spring.sql.init.mode=never

# No ejecutar V001-V021 de H2 sobre PostgreSQL. La ruta no existe todavía:
# el arranque se detiene hasta implementar y validar las migraciones PostgreSQL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql
spring.flyway.fail-on-missing-locations=true
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
