# Solo para una estación de desarrollo local; no activar este perfil en un despliegue compartido.
logging.level.com.miec=DEBUG
# La consola sigue apagada hasta solicitarla explícitamente.
spring.h2.console.enabled=${MIEC_DEV_H2_CONSOLE:false}
# Parámetros SQL y credenciales no se registran ni siquiera en dev.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
