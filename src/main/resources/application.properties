
# ============================================================================
# Configuración de la aplicación MIEC
# ============================================================================

# Nombre de la aplicación
spring.application.name=miec-prototype

# Puerto del servidor (diferente al de PetClinic)
server.port=8081
# El MVP exige autenticación; loopback sigue siendo el ámbito de despliegue predeterminado.
server.address=${MIEC_SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.log-request-details=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Usuarios locales MVP-02: sin contraseña configurada no se habilita la cuenta.
miec.api.author.username=${MIEC_AUTHOR_USERNAME:author}
miec.api.author.password=${MIEC_AUTHOR_PASSWORD:}
miec.api.approver.username=${MIEC_APPROVER_USERNAME:approver}
miec.api.approver.password=${MIEC_APPROVER_PASSWORD:}

# ============================================================================
# Configuración de la base de datos H2
# ============================================================================

# URL de conexión a H2 (base de datos en archivo para persistencia)
spring.datasource.url=${MIEC_DB_URL:jdbc:h2:file:./data/miecdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}

# Credenciales de la base de datos
spring.datasource.username=${MIEC_DB_USERNAME:sa}
spring.datasource.password=${MIEC_DB_PASSWORD:}

# Driver de H2
spring.datasource.driverClassName=org.h2.Driver

# Consola deshabilitada; solo dev permite su activación explícita y autenticada.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================================
# Configuración de JPA/Hibernate
# ============================================================================

# Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Estrategia de generación de DDL (usamos Flyway, así que debe ser 'none')
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL en consola (solo para desarrollo)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# Configuración de Flyway
# ============================================================================

# Habilitar Flyway
spring.flyway.enabled=true

# Ubicación de los scripts de migración
spring.flyway.locations=classpath:db/migration

# Tabla de historial de Flyway
spring.flyway.table=flyway_schema_history

# Validar migraciones al arrancar
spring.flyway.validate-on-migrate=true

# ============================================================================
# Logging
# ============================================================================

# Sin SQL, parámetros ni detalles de solicitudes en la configuración base.
logging.level.com.miec=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Swagger requiere las mismas cuentas configuradas; no conserva autorización.
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.query-config-enabled=false
springdoc.swagger-ui.validator-url=
springdoc.paths-to-match=/api/**

# Adaptador HTTP genérico opt-in. Las rutas y la clave se configuran solo en el servidor.
miec.recipient.enabled=${MIEC_RECIPIENT_ENABLED:false}
miec.recipient.adapter-id=${MIEC_RECIPIENT_ADAPTER_ID:http-recipient-v1}
miec.recipient.adapter-version=${MIEC_RECIPIENT_ADAPTER_VERSION:1}
miec.recipient.destination-id=${MIEC_RECIPIENT_DESTINATION_ID:}
miec.recipient.base-url=${MIEC_RECIPIENT_BASE_URL:}
miec.recipient.api-key=${MIEC_RECIPIENT_API_KEY:}
miec.recipient.execute-path=${MIEC_RECIPIENT_EXECUTE_PATH:/miec/operations}
miec.recipient.timeout=${MIEC_RECIPIENT_TIMEOUT:PT10S}
