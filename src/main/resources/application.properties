
# ============================================================================
# Configuración de la aplicación MIEC
# ============================================================================

# Nombre de la aplicación
spring.application.name=miec-prototype

# Puerto del servidor (diferente al de PetClinic)
server.port=8081

# ============================================================================
# Configuración de la base de datos H2
# ============================================================================

# URL de conexión a H2 (base de datos en archivo para persistencia)
spring.datasource.url=jdbc:h2:file:./data/miecdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Credenciales de la base de datos
spring.datasource.username=sa
spring.datasource.password=

# Driver de H2
spring.datasource.driverClassName=org.h2.Driver

# Habilitar la consola H2 para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================================
# Configuración de JPA/Hibernate
# ============================================================================

# Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Estrategia de generación de DDL (usamos Flyway, así que debe ser 'none')
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL en consola (solo para desarrollo)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# Configuración de Flyway
# ============================================================================

# Habilitar Flyway
spring.flyway.enabled=true

# Ubicación de los scripts de migración
spring.flyway.locations=classpath:db/migration

# Tabla de historial de Flyway
spring.flyway.table=flyway_schema_history

# Validar migraciones al arrancar
spring.flyway.validate-on-migrate=true

# ============================================================================
# Logging
# ============================================================================

# Nivel de logging para desarrollo
logging.level.com.miec=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
