name: MVP - build and regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SDK_REPOSITORY: jesusmarin/miec-recipient-sdk
      SDK_REF: 5cb3b0fa7971070954acaa7fd2e89620b04f2f51
    defaults:
      run:
        working-directory: miec-prototype
        shell: bash
    steps:
      - name: Checkout prototype
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: miec-prototype
          persist-credentials: false
      - name: Validate SDK credential and pinned source
        if: vars.SDK_PRIVATE == 'true'
        env:
          SDK_READ_TOKEN: ${{ secrets.RECIPIENT_SDK_READ_TOKEN }}
        run: python3 .github/scripts/check_sdk_access.py
      - name: Checkout pinned test SDK
        if: vars.SDK_PRIVATE != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: miec-recipient-sdk
          persist-credentials: false
      - name: Checkout private pinned test SDK
        if: vars.SDK_PRIVATE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: miec-recipient-sdk
          persist-credentials: false
          # Private SDK: never silently replace its credential with the prototype's token.
          token: ${{ secrets.RECIPIENT_SDK_READ_TOKEN }}
      - name: Test CI credential diagnostic without network
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            miec-prototype/pom.xml
            miec-recipient-sdk/pom.xml
      - name: Build and test SDK dependency
        run: bash ./mvnw --batch-mode --no-transfer-progress -f ../miec-recipient-sdk/pom.xml clean install
      - name: Build and run prototype regression
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify packaged application across JVM restarts
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=MvpLifecycleRestartIT
          -Dmiec.mvp.jar=target/miec-prototype-0.0.1-SNAPSHOT.jar test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mvp-test-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            miec-prototype/target/surefire-reports/
            miec-prototype/target/failsafe-reports/
            miec-recipient-sdk/target/surefire-reports/
